# Render Blueprint: the API server and its database. In Render, choose
# New → Blueprint and point it at this repository.
services:
  - type: web
    name: cpl-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cpl-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: MESSAGING_KEY
        generateValue: true
      - key: PLATFORM_KEY
        generateValue: true
databases:
  - name: cpl-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
